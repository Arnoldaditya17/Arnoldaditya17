name: XO Game

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: xo-game
  cancel-in-progress: false

jobs:
  play:
    # Only react to issues this game created.
    if: startsWith(github.event.issue.title, 'xo|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply move and compute reply
        env:
          MOVE_TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python xo/bot.py

      - name: Commit updated board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md xo/state.json
          if git diff --quiet --cached; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "XO: ${{ github.event.issue.title }} by @${{ github.event.issue.user.login }}"
          # Another game move may have landed while this one was running.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.event.repository.default_branch }} && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          exit 1

      - name: Close the issue with the bot's reply
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MESSAGE="Something went wrong — check the Actions log."
          if [ -f xo/last_message.txt ]; then
            MESSAGE="$(cat xo/last_message.txt)"
          fi
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "$MESSAGE"
